_BASE_: [
  '../datasets/my_coco_test.yml',
  '../runtime.yml',
  '_base_/picodet_v2.yml',
  '_base_/optimizer_300e.yml',
  '_base_/picodet_320_reader.yml',
]
pretrain_weights: https://paddle-imagenet-models-name.bj.bcebos.com/dygraph/legendary_models/PPLCNet_x0_75_pretrained.pdparams
weights: output/picodet_s_320_mydata/best_model
find_unused_parameters: True
use_ema: true
epoch: 100
snapshot_epoch: 10
LCNet:
  scale: 0.75
  feature_maps: [3, 4, 5]
LCPAN:
  out_channels: 96
PicoHeadV2:
  conv_feat:
    name: PicoFeat
    feat_in: 96
    feat_out: 96
    num_convs: 2
    num_fpn_stride: 4
    norm_type: bn
    share_cls_reg: True
    use_se: True
  feat_in_chan: 96
  nms:
    name: MultiClassNMS
    nms_top_k: 1000
    keep_top_k: 100
    score_threshold: 0.05 
    nms_threshold: 0.4
TrainReader:
  batch_size: 8
  num_workers: 2
LearningRate:
  base_lr: 0.02
  schedulers:
  - !CosineDecay
    max_epochs: 100
  - !LinearWarmup
    start_factor: 0.1
    steps: 200
